services:
  openvpn:
    image: gryonix-openvpn:local
    container_name: openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - /opt/openvpn/data:/etc/openvpn
    ports:
      - "1194:1194/udp"